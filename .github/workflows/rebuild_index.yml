name: Rebuild TikTok Vibe Calendar Index

# 触发条件：
# 1. 监测到任何 .py 文件发生 push 推送时自动触发
# 2. 每周一自动运行
# 3. 允许在 GitHub 网页手动点击触发
on:
  push:
    paths:
      - '**.py'          # 只要有任何 Python 文件变动并推送就触发
      - 'requirements.txt' # (可选) 依赖变动时也触发
    branches:
      - main             # 你的主分支名（如果是 master 请改成 master）

  schedule:
    - cron: '0 0 * * 1'  # 每周一 UTC 00:00 (北京时间早上 8:00) 运行

  workflow_dispatch:     # 允许在 Actions 页面手动点击 "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 赋予机器人写入和提交代码的权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Rebuild TikTok Calendar Index
        # 运行脚本自动扫描 docs 目录并更新生成 index.html
        run: python tiktok_app.py --build

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 追踪 docs 及所有子文件夹变动
          git add .
          
          # 如果 index.html 或归档有变动，自动提交推送；
          # 加上 [skip ci] 可以防止机器人自动提交后又重复死循环触发 Actions
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto rebuild TikTok vibe calendar index [skip ci]" && git push)