name: Rebuild TikTok Vibe Calendar Index

# 触发条件：每周一自动运行 + 支持网页上手动点击运行
on:
  schedule:
    - cron: '0 0 * * 1'  # 每周一 UTC 00:00 (北京时间早上 8:00) 运行
  workflow_dispatch:     # 允许在 GitHub Actions 页面手动点击 "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 赋予机器人写入和提交代码的权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Rebuild TikTok Calendar Index
        # 运行脚本自动扫描 docs 目录并更新生成 index.html
        run: python tiktok_app.py --build

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 追踪 docs 及所有子文件夹变动
          git add .
          
          # 如果有新归档或 index.html 变动，自动提交并推送
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto rebuild TikTok vibe calendar index [skip ci]" && git push)